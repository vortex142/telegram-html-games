<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Arcade Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(10, 20, 40, 0.8) 0%, rgba(5, 5, 10, 1) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 100%, 100% 4px, 6px 100%;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 22px;
            color: #ff007f;
            text-shadow: 3px 3px 0px #00ffcc, 6px 6px 0px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 9px;
            color: #a0a0c0;
            text-transform: uppercase;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px;
            flex-grow: 1;
        }

        .game-card {
            background: rgba(15, 15, 30, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
            border-color: #ff007f;
        }

        .game-title {
            font-size: 14px;
            color: #ffff00;
            margin-bottom: 12px;
        }

        .game-desc {
            font-size: 8px;
            color: #b0b0d0;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .play-btn {
            display: block;
            width: 100%;
            background: #ff007f;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            box-shadow: 0 4px 0 #99004c;
            transition: all 0.1s ease;
        }

        .play-btn:hover {
            background: #ff3399;
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #99004c;
        }

        footer {
            margin-top: 40px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 7px;
            color: #606080;
            line-height: 1.8;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <header>
        <h1>VORTEX ARCADE</h1>
    </header>

    <div class="container">
        <div class="game-card">
            <div>
                <div class="game-title">🚀 SPACE SHOOTER</div>
                <div class="game-desc">Бесконечный ретро-шутер. Уклоняйся от метеоритов, уничтожай врагов, собирай паверапы и устанавливай рекорды прямо в Telegram!</div>
            </div>
            <a href="space-shooter/" class="play-btn">[ ИГРАТЬ ]</a>
        </div>

        <!-- Здесь в будущем появятся новые игры -->
    </div>
</body>
</html>
