<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Space Shooter - TMA Easter Egg</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #050508;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            background: #020208;
        }

        /* Retro CRT Scanlines effect overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Glowing text effects */
        .glow-green {
            text-shadow: 0 0 8px #00ffcc, 0 0 15px #00ffcc;
        }
        .glow-red {
            text-shadow: 0 0 8px #ff0055, 0 0 15px #ff0055;
        }
        .glow-yellow {
            text-shadow: 0 0 8px #ffcc00, 0 0 15px #ffcc00;
        }

        #ui-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        #ui-title {
            margin-bottom: 0.5rem;
            color: #22d3ee;
            font-size: clamp(1.25rem, 5vw, 1.875rem);
            line-height: 1.5;
        }

        #score-board {
            margin-bottom: 1.5rem;
            font-size: clamp(0.65rem, 2.5vw, 0.875rem);
        }

        #score-board p {
            margin: 0;
        }

        #score-board p + p {
            margin-top: 0.5rem;
        }

        .retro-btn {
            font-family: 'Press Start 2P', monospace;
            border: 3px solid #00ffcc;
            background: #0d0f18;
            color: #00ffcc;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px #008866;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            font-size: clamp(0.625rem, 2.8vw, 0.875rem);
            font-weight: bold;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #008866;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- CRT Overlay -->
        <div class="crt-overlay"></div>

        <!-- Main Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay: Start / Game Over Screen -->
        <div id="ui-screen">
            <h1 id="ui-title" class="glow-green">VORTEX<br>STRIKER</h1>
            
            <div id="score-board" class="hidden">
                <p class="glow-red" id="final-score">SCORE: 0</p>
                <p class="glow-yellow" id="final-high">BEST: 0</p>
            </div>

            <button id="start-btn" onclick="startGame()" class="retro-btn">
                [ START GAME ]
            </button>

        </div>
    </div>

    <script>
        // --- Telegram WebApp Integration ---
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#050508');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#050508');
        }

        function triggerHaptic(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else tg.HapticFeedback.impactOccurred('light');
            }
        }

        // --- Web Audio API synth sound generator ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const audio = new SoundFX();

        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiScreen = document.getElementById('ui-screen');
        const scoreBoard = document.getElementById('score-board');
        const finalScoreEl = document.getElementById('final-score');
        const finalHighEl = document.getElementById('final-high');

        let W = 360;
        let H = 640;

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const aspect = 9 / 16;
            let w = container.clientWidth;
            let h = container.clientHeight;

            if (w / h > aspect) {
                w = h * aspect;
            } else {
                h = w / aspect;
            }

            canvas.width = W = Math.floor(w);
            canvas.height = H = Math.floor(h);
        }
        window.addEventListener('resize', resizeCanvas);
        window.visualViewport?.addEventListener('resize', resizeCanvas);
        tg?.onEvent?.('viewportChanged', resizeCanvas);
        resizeCanvas();

        // --- State Variables ---
        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('vortex_high_score') || '0');
        let frameCount = 0;
        let touchX = null;
        let touchY = null;

        // Player Object
        const player = {
            x: W / 2,
            y: H - 80,
            width: 28,
            height: 32,
            speed: 5,
            weaponLevel: 1,
            hp: 3,
            maxHp: 3
        };

        // Arrays
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let stars = [];

        function initStars() {
            stars = [];
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 1.5 + 0.5,
                    color: Math.random() > 0.3 ? '#ffffff' : '#00ffcc'
                });
            }
        }

        function clampPlayer() {
            if (player.x < player.width / 2) player.x = player.width / 2;
            if (player.x > W - player.width / 2) player.x = W - player.width / 2;
            if (player.y < player.height / 2) player.y = player.height / 2;
            if (player.y > H - player.height / 2) player.y = H - player.height / 2;
        }

        // Touch & Mouse Drag Control
        function handlePointerMove(clientX, clientY) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = clientX - rect.left;
            const currentY = clientY - rect.top;

            if (touchX !== null && touchY !== null) {
                player.x += (currentX - touchX);
                player.y += (currentY - touchY);
                clampPlayer();
            }
            touchX = currentX;
            touchY = currentY;
        }

        canvas.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            touchY = e.touches[0].clientY - rect.top;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        canvas.addEventListener('touchend', () => { 
            touchX = null; 
            touchY = null; 
        });

        // --- Controls Input ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // --- Spawn Entities ---
        function spawnEnemy() {
            const size = Math.random() * 16 + 20;
            enemies.push({
                x: Math.random() * (W - size * 2) + size,
                y: -size,
                width: size,
                height: size,
                speed: Math.random() * 1.5 + 1.5 + (score / 500),
                hp: Math.random() > 0.7 ? 2 : 1,
                color: Math.random() > 0.5 ? '#ff0055' : '#ffcc00'
            });
        }

        function spawnPowerup(x, y) {
            if (Math.random() < 0.25) { // 25% drop rate
                powerups.push({
                    x: x,
                    y: y,
                    width: 16,
                    height: 16,
                    speed: 1.5,
                    type: Math.random() > 0.5 ? 'weapon' : 'heal'
                });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 1,
                    life: 20,
                    color: color || '#ffcc00'
                });
            }
        }

        function fireBullet() {
            audio.playShoot();
            triggerHaptic('light');

            if (player.weaponLevel === 1) {
                bullets.push({ x: player.x, y: player.y - 15, dx: 0, dy: -8 });
            } else if (player.weaponLevel >= 2) {
                bullets.push({ x: player.x - 8, y: player.y - 15, dx: -1, dy: -8 });
                bullets.push({ x: player.x + 8, y: player.y - 15, dx: 1, dy: -8 });
            }
        }

        // --- Main Game Loop ---
        function update() {
            frameCount++;

            // Handle Keyboard/Touch Movement (2D)
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            clampPlayer();

            // Auto Fire
            if (frameCount % 12 === 0) {
                fireBullet();
            }

            // Update Starfield
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > H) s.y = 0;
            });

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;
                if (b.y < 0) bullets.splice(i, 1);
            }

            // Spawn Enemies
            if (frameCount % Math.max(20, 60 - Math.floor(score / 50)) === 0) {
                spawnEnemy();
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                // Player Collision
                if (Math.abs(e.x - player.x) < (e.width + player.width) / 2 &&
                    Math.abs(e.y - player.y) < (e.height + player.height) / 2) {
                    
                    createExplosion(e.x, e.y, e.color);
                    enemies.splice(i, 1);
                    player.hp--;
                    audio.playExplosion();
                    triggerHaptic('heavy');

                    if (player.hp <= 0) {
                        gameOver();
                        return;
                    }
                    continue;
                }

                // Bullet Collision
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.abs(e.x - b.x) < e.width / 2 + 3 &&
                        Math.abs(e.y - b.y) < e.height / 2 + 3) {
                        
                        bullets.splice(j, 1);
                        e.hp--;
                        createExplosion(b.x, b.y, '#00ffcc');

                        if (e.hp <= 0) {
                            score += 10;
                            audio.playExplosion();
                            triggerHaptic('medium');
                            spawnPowerup(e.x, e.y);
                            createExplosion(e.x, e.y, e.color);
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }

                // Enemy out of bounds
                if (e.y > H + 50) enemies.splice(i, 1);
            }

            // Update Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.y += p.speed;

                if (Math.abs(p.x - player.x) < (p.width + player.width) / 2 &&
                    Math.abs(p.y - player.y) < (p.height + player.height) / 2) {
                    
                    audio.playPowerup();
                    triggerHaptic('medium');
                    if (p.type === 'weapon') {
                        player.weaponLevel = Math.min(2, player.weaponLevel + 1);
                    } else if (p.type === 'heal') {
                        player.hp = Math.min(player.maxHp, player.hp + 1);
                    }
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.y > H + 20) powerups.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        // --- Render Frame ---
        function render() {
            ctx.clearRect(0, 0, W, H);

            // Draw Starfield
            stars.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Draw Bullets
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
            });

            // Draw Player Ship (Retro Pixel Style)
            ctx.fillStyle = '#00ffcc';
            // Cockpit
            ctx.fillRect(player.x - 3, player.y - 18, 6, 6);
            // Main Body
            ctx.fillRect(player.x - 9, player.y - 12, 18, 18);
            // Wings
            ctx.fillRect(player.x - 18, player.y + 2, 36, 6);
            // Thruster Flame
            ctx.fillStyle = frameCount % 6 < 3 ? '#ff0055' : '#ffcc00';
            ctx.fillRect(player.x - 4, player.y + 12, 8, 8);

            // Draw Enemies (Retro Monster Pixel Art)
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                // Outer Body
                ctx.fillRect(e.x - e.width / 2, e.y - e.height / 2, e.width, e.height);
                // Inner Eye/Detail
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x - e.width / 4, e.y - e.height / 6, e.width / 2, e.height / 3);
            });

            // Draw Powerups
            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'weapon' ? '#ffcc00' : '#00ffaa';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.font = '8px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(p.type === 'weapon' ? 'W' : '+', p.x, p.y + 3);
            });

            // Draw Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            });

            // Draw HUD (Score & HP)
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px "Press Start 2P"';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 12, 24);

            // Health Bar
            for (let i = 0; i < player.maxHp; i++) {
                ctx.fillStyle = i < player.hp ? '#ff0055' : '#333344';
                ctx.fillRect(W - 15 - (i * 14), 14, 10, 10);
            }
        }

        function gameLoop() {
            if (gameRunning) {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }
        }

        // --- Start & Game Over State Handling ---
        window.startGame = function() {
            audio.init();
            gameRunning = true;
            score = 0;
            player.hp = player.maxHp;
            player.weaponLevel = 1;
            player.x = W / 2;
            player.y = H - 80;

            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];

            initStars();
            uiScreen.classList.add('hidden');

            triggerHaptic('medium');
            gameLoop();
        };

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('vortex_high_score', highScore.toString());
            }

            finalScoreEl.innerText = `SCORE: ${score}`;
            finalHighEl.innerText = `BEST: ${highScore}`;

            scoreBoard.classList.remove('hidden');
            uiScreen.classList.remove('hidden');
            document.getElementById('start-btn').innerText = '[ RESTART ]';

            triggerHaptic('heavy');
        }

        // Initialize background rendering behind the start screen
        initStars();
        render();
    </script>
</body>
</html>
